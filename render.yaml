services:
  - type: web
    name: wazobia-agent-backend
    runtime: docker
    region: oregon
    envVars:
      - key: WAZOBIA_LLM_PROVIDER
        value: groq
      - key: WAZOBIA_ENVIRONMENT
        value: production
      - key: GROQ_API_KEY
        sync: false
      - key: PIPER_HOME
        value: /var/data/piper
    mounts:
      - path: /var/data
        sizeGB: 2