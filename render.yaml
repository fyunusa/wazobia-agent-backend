services:
  - type: web
    name: wazobia-agent-backend
    runtime: python
    runtimeVersion: 3.10
    buildCommand: bash build.sh
    startCommand: uvicorn app.api:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: WAZOBIA_LLM_PROVIDER
        value: groq
      - key: WAZOBIA_ENVIRONMENT
        value: production
      - key: GROQ_API_KEY
        sync: false
      - key: PIPER_HOME
        value: /var/data/piper
    mounts:
      - path: /var/data
        sizeGB: 1